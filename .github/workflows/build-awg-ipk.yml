name: Build AWG IPK

on:
  workflow_dispatch:

jobs:
  build-awg:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master-v24.10

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-distutils \
            python3-setuptools rsync swig unzip zlib1g-dev file wget subversion

      - name: Add AWG feed
        run: |
          grep -q '^src-git amneziawg ' feeds.conf.default || \
            echo 'src-git amneziawg https://github.com/amnezia-vpn/amneziawg-openwrt.git' >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure target and packages
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_ALL_PROFILES=y
          CONFIG_PACKAGE_kmod-wireguard=m
          CONFIG_PACKAGE_kmod-amneziawg=m
          CONFIG_PACKAGE_amneziawg-tools=m
          CONFIG_PACKAGE_luci-proto-amneziawg=m
          CONFIG_PACKAGE_luci-i18n-amneziawg-ru=m
          EOF
          make defconfig

      - name: Prepare toolchain and target
        run: |
          make -j"$(nproc)" tools/install
          make -j"$(nproc)" toolchain/install
          make -j"$(nproc)" target/compile

      - name: Build AWG packages
        run: |
          make -j"$(nproc)" package/feeds/amneziawg/amneziawg-tools/compile V=s
          make -j"$(nproc)" package/feeds/amneziawg/kmod-amneziawg/compile V=s
          make -j"$(nproc)" package/feeds/amneziawg/luci-proto-amneziawg/compile V=s
          make -j"$(nproc)" package/feeds/amneziawg/luci-i18n-amneziawg-ru/compile V=s || true

      - name: Upload IPK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: awg-ipk-rockchip-armv8
          path: |
            bin/targets/rockchip/armv8/packages/kmod-amneziawg*.ipk
            bin/packages/**/amneziawg-tools*.ipk
            bin/packages/**/luci-proto-amneziawg*.ipk
            bin/packages/**/luci-i18n-amneziawg-ru*.ipk
